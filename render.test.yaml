# Dedicated HMH TEST deployment. This blueprint intentionally defines no cron
# jobs and no outbound integration credentials.
services:
  - type: web
    name: hmh-test-backend
    runtime: python
    rootDir: hmh-backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: test
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PYTHONIOENCODING
        value: utf-8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: https://test.hmhgroup.co.za,https://hmh-test-frontend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://test.hmhgroup.co.za
      - key: SUPABASE_URL
        value: https://ekipedffcywxlabchznq.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_PRIVATE_BUCKET
        value: hmh-evidence-private
      - key: SMTP_ENABLED
        value: "false"
      - key: EMAIL_MOCK_MODE
        value: "true"
      - key: IMAP_ENABLED
        value: "false"
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: OCR_PROVIDER
        value: disabled
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: GOOGLE_CREDENTIALS_JSON
        value: ""
      - key: CRON_SECRET
        value: ""
      - key: RUN_STARTUP_SEED
        value: "false"

  - type: web
    name: hmh-test-frontend
    runtime: static
    rootDir: hmh-frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_APP_ENV
        value: test
      - key: VITE_API_BASE_URL
        value: https://hmh-test-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

