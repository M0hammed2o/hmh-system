# Render deployment configuration — HMH Construction OS
#
# The notification queue is drained automatically by two mechanisms:
#   1. In-process background task (_queue_drain_loop in main.py) — fires every 5 min
#   2. Render cron job below — external safety net, fires every 5 min
#
# Required env vars for WhatsApp (set in Render dashboard):
#   WHATSAPP_ENABLED=true
#   WHATSAPP_PHONE_NUMBER_ID, WHATSAPP_BUSINESS_ACCOUNT_ID
#   WHATSAPP_ACCESS_TOKEN  (permanent system user token from Meta)
#   WHATSAPP_APP_SECRET    (App Secret from Meta App settings — for HMAC verification)
#   WHATSAPP_VERIFY_TOKEN  (change from default "hmh_verify_token")
#   WHATSAPP_ALERT_TEMPLATE_NAME  (name of your approved Meta template)
#   CRON_SECRET            (random string for the cron endpoint)

services:
  - type: web
    name: hmh-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    # Fail-closed release: migration failure must abort the deploy, not just log
    # and continue serving against a stale schema. See RUNBOOK.md.
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: hmh-backend
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11"

      # ── Bypass Orders (AI Document Import) ────────────────────────────
      # ON, so staff can reach the page and upload paperwork.
      #
      # ANTHROPIC_API_KEY is NOT set here — it is added in the Render
      # dashboard (sync: false) when you are ready to spend on extraction.
      # Until it is, the engine runs degraded on purpose: it stores, hashes,
      # de-duplicates and queues documents for human review, but reads
      # almost nothing off them. The page says so plainly rather than
      # implying the AI is working — GET /api/v1/ai-import/service-status
      # reports exactly which integrations are configured.
      #
      # AI_IMPORT_AUTO_POST_ENABLED stays false. Nothing reaches stock,
      # supplier balances or the ledger without a person approving it.
      # Turning it on is a business decision taken on measured extraction
      # accuracy, not a deployment setting. See
      # docs/AI_DOCUMENT_IMPORT_PILOT.md before changing it.
      - key: AI_IMPORT_ENABLED
        value: "true"
      - key: AI_IMPORT_AUTO_POST_ENABLED
        value: "false"
      - key: AI_IMPORT_MODEL
        value: claude-opus-5-5
      - key: AI_IMPORT_WORKER_ENABLED
        value: "true"
      - key: AI_IMPORT_WORKER_BATCH_SIZE
        value: "2"
      - key: AI_IMPORT_WORKER_INTERVAL_SECONDS
        value: "30"
      - key: AI_IMPORT_MAX_UPLOAD_MB
        value: "20"
      - key: AI_IMPORT_SCAN_ENABLED
        value: "false"
      # Added by hand in the dashboard, never in this file:
      #   ANTHROPIC_API_KEY  — enables extraction
      - key: ANTHROPIC_API_KEY
        sync: false

  - type: web
    name: hmh-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    rootDir: hmh-frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

cronJobs:
  # External safety-net trigger for notification queue drain.
  # Uses the lightweight /api/v1/internal/process-notifications endpoint
  # which requires only X-Cron-Secret (no JWT needed).
  # The in-process background task in main.py is the primary drain mechanism.
  - name: notification-queue-drain
    schedule: "*/5 * * * *"
    command: >
      curl -s -f -X POST
      https://hmh-backend-uhzu.onrender.com/api/v1/internal/process-notifications
      -H "X-Cron-Secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false
